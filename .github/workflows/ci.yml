name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install openconnect (build-time dependency)
        run: brew install openconnect

      - name: Build
        run: ./build.sh

      - name: CLI smoke test
        run: |
          ./dist/rwth-vpn help
          ./dist/rwth-vpn status

      - name: Bundled client smoke test
        run: ./scripts/test-bundled.sh

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: RWTH-VPN-cli
          path: |
            dist/rwth-vpn
            dist/resources
          if-no-files-found: error
