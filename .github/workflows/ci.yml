name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install openconnect (build-time dependency)
        run: brew install openconnect

      - name: Build
        run: ./build.sh

      - name: Self test
        run: '"dist/RWTH VPN.app/Contents/MacOS/RWTHVPN" --selftest'

      - name: Bundled client smoke test
        run: ./scripts/test-bundled.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: RWTH-VPN-app
          path: dist/RWTH VPN.app
          if-no-files-found: error
