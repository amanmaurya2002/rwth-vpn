name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install openconnect (build-time dependency)
        run: brew install openconnect

      - name: Build
        run: ./build.sh --revendor

      - name: Package
        run: |
          VERSION=$(sed -n 's/.*static let cliVersion = "\(.*\)".*/\1/p' Sources/AppInfo.swift)
          CLI_STAGE="$RUNNER_TEMP/rwth-vpn-cli"
          mkdir -p "$CLI_STAGE"
          cp "dist/rwth-vpn" "$CLI_STAGE/rwth-vpn-cli"
          cp -R "dist/resources" "$CLI_STAGE/resources"
          tar -czf "dist/rwth-vpn-cli-${VERSION}.tar.gz" -C "$CLI_STAGE" rwth-vpn-cli resources
          shasum -a 256 "dist/rwth-vpn-cli-${VERSION}.tar.gz" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
