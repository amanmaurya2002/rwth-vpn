name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install openconnect (build-time dependency)
        run: brew install openconnect

      - name: Import signing identity (optional)
        env:
          SIGN_P12_BASE64: ${{ secrets.SIGN_P12_BASE64 }}
          SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
        run: |
          if [ -z "${SIGN_P12_BASE64}" ]; then
            echo "No signing identity configured - building ad-hoc signed."
            exit 0
          fi
          echo "${SIGN_P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$RUNNER_TEMP/identity.p12" -k build.keychain \
            -P "${SIGN_P12_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain

      - name: Build
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          ID="${SIGN_IDENTITY:--}"
          SIGN_IDENTITY="$ID" ./build.sh --dmg

      - name: Package
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "dist/RWTH VPN.app/Contents/Info.plist")
          ditto -c -k --sequesterRsrc --keepParent "dist/RWTH VPN.app" "dist/RWTH VPN-${VERSION}.zip"
          CLI_STAGE="$RUNNER_TEMP/rwth-vpn-cli"
          mkdir -p "$CLI_STAGE"
          cp "dist/rwth-vpn" "$CLI_STAGE/rwth-vpn-cli"
          cp -R "dist/RWTH VPN.app/Contents/Resources" "$CLI_STAGE/resources"
          tar -czf "dist/rwth-vpn-cli-${VERSION}.tar.gz" -C "$CLI_STAGE" rwth-vpn-cli resources
          shasum -a 256 dist/*.dmg dist/*.zip dist/*.tar.gz > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
