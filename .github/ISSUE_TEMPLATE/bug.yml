name: Bug report
description: Something does not work (connection or install)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials, tokens, or the contents of your Keychain.**
        Remove your username if you prefer. Do not include passwords or tokens.
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Run `rwth-vpn --help` or check the latest release, e.g. v1.2.5
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 26.0, M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      placeholder: |
        1. Installed with the curl installer
        2. Ran `rwth-vpn setup`
        3. Ran `rwth-vpn connect`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened / what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Command output
      description: Paste the relevant terminal output without credentials.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not include my password or token secret.
          required: true
        - label: I am on an Apple Silicon Mac with macOS 26+.
          required: true
